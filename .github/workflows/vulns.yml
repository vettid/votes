name: vulns

# Vulnerability scans. They report; they never change a dependency.
#
# - govulncheck v1.9.0 over the Go module (cdk/go.mod only keeps the Go
#   tool out of cdk/), with the Go of go.mod: fails only on a
#   vulnerability the code reaches; -show verbose also names those in
#   imported packages and required modules that the code doesn't call.
# - npm audit over cdk/package-lock.json, the only lockfile. It is the
#   CDK app's: no npm package is bundled into anything that runs (votes-api
#   is a Go Lambda built by scripts/build-api.sh; the key watch heartbeat
#   is inline code that uses the Lambda runtime's own AWS SDK; the stacks
#   use no custom resource of aws-cdk-lib), so npm code runs only at synth
#   and deploy time. Its runtime dependencies (aws-cdk-lib, constructs;
#   --omit=dev) are audited at high: a high or critical advisory is
#   reported (a warning and the weekly issue), not a failed build. The
#   whole tree, dev dependencies included, is listed in the job summary.
#
# On pull requests, on pushes to main, weekly and on demand. On main, a
# weekly or on-demand run with a finding opens one issue, or comments on
# the one already open; a clean run closes it.
#
# Actions are pinned by commit SHA (tag in the comment).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '47 5 * * 1' # Mondays, 05:47 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck v1.9.0
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -show verbose ./...

  npm-audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      # The number of high and critical advisories in cdk/'s runtime
      # dependencies; empty if the audit gave none.
      high: ${{ steps.audit.outputs.high }}
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # npm audit reads package-lock.json; no install needed. It exits 1
      # both on an advisory and on a failure to audit: the counts come
      # from its JSON, and an audit that gives none fails the job.
      - name: audit (runtime at high; CDK only, reported, not failed)
        id: audit
        run: |
          set +e
          npm audit --omit=dev --json > runtime.json
          npm audit --json > all.json
          set -e
          high=$(jq -e '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical' runtime.json) || { echo "::error::npm audit gave no result"; exit 1; }
          jq -e '.metadata.vulnerabilities' all.json > /dev/null || { echo "::error::npm audit gave no result"; exit 1; }
          echo "high=$high" >> "$GITHUB_OUTPUT"
          {
            echo '## npm audit, cdk/ (the CDK app, deploy-time only)'
            echo
            echo "Runtime dependencies (--omit=dev): $high high or critical."
            echo
            echo '| Package | Severity | Advisory |'
            echo '|---|---|---|'
            jq -r '.vulnerabilities // {} | to_entries[]
              | .key as $n | .value.severity as $s
              | [.value.via[] | objects | "[\(.title)](\(.url))"] as $v
              | select($v | length > 0)
              | "| \($n) | \($s) | \($v | join("<br>")) |"' all.json
            echo
            jq -r '"All dependencies, dev included: " + (.metadata.vulnerabilities | to_entries | map("\(.key) \(.value)") | join(", "))' all.json
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$high" -gt 0 ]; then
            echo "::warning::npm audit: $high high or critical advisories in cdk/'s runtime dependencies (the CDK app, deploy-time only; reported, not failed; see the job summary)"
          fi

  issue:
    # One issue for all findings: opened, or commented on while open; a
    # clean run closes it.
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [govulncheck, npm-audit]
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GOVULN: ${{ needs.govulncheck.result }}
          NPM: ${{ needs.npm-audit.result }}
          HIGH: ${{ needs.npm-audit.outputs.high }}
        run: |
          what=""
          if [ "$GOVULN" != success ]; then
            what="$what
          - govulncheck: a vulnerability the code reaches, or the scan could not run (the job log names it)."
          fi
          if [ "$NPM" != success ] || [ -z "$HIGH" ]; then
            what="$what
          - npm audit could not run over cdk/package-lock.json."
          elif [ "$HIGH" -gt 0 ]; then
            what="$what
          - npm audit: $HIGH high or critical advisories in cdk/'s runtime dependencies (the CDK app, deploy-time only; the job summary lists them)."
          fi
          title="security: vulnerability scan findings"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$what" ]; then
            if [ -n "$n" ]; then
              gh issue comment "$n" --body "Found again: $RUN$what"
            else
              gh issue create --title "$title" --body "The vulnerability scan on main (.github/workflows/vulns.yml) found:$what

          See $RUN."
            fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Clean on main: $RUN"
          fi
