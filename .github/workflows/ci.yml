name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags=-buildid= -o /dev/null ./cmd/votes-api
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/votesctl

  cdk:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest

  integration:
    # S3's conditional writes against LocalStack, from VettID's mirror of
    # the upstream digest (vettid.org .github/mirror):
    # public.ecr.aws/localstack/localstack:4.9@sha256:59373b4a27dba3ec15c4db0b7455f0cb68c8a42300e2cbbe362b440f9a131697
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    services:
      localstack:
        image: ghcr.io/vettid/mirror/localstack@sha256:59373b4a27dba3ec15c4db0b7455f0cb68c8a42300e2cbbe362b440f9a131697
        ports: ["4566:4566"]
        env:
          SERVICES: s3
          LOCALSTACK_HOST: 127.0.0.1:4566
        options: --memory 1536m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: wait for LocalStack
        run: for i in $(seq 1 90); do curl -sf http://127.0.0.1:4566/_localstack/health >/dev/null && exit 0; sleep 1; done; exit 1
      - name: integration tests
        env:
          VOTES_IT_LOCALSTACK: http://127.0.0.1:4566
        run: go test -count=1 -tags integration ./site/s3store/ ./cmd/votesctl/

  gitleaks:
    # Pinned binary over the FULL history (the gitleaks-action fails on a
    # branch's first push, where there is no "before" commit).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks v8.30.1 (checksum-verified)
        run: |
          curl -sSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: scan full history
        run: ./gitleaks git --redact --verbose .
