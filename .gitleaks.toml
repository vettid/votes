[extend]
useDefault = true

# The site's test vote (site/testdata/vote.json): a service seed derived
# from a fixed, public phrase, public keys and signatures, and Sigstore
# bundles from its public staging log. Nothing in it is a secret.
[[allowlists]]
description = "the site's public test vote"
paths = ['''^site/testdata/vote\.json$''', '''^site/testdata/staging_trusted_root\.json$''']

# CDK build output and node_modules committed by mistake to one branch
# (votes PR #3) and removed in the next commit: asset hashes and package
# files, no secrets. The branch is squash-merged, so main never has them.
[[allowlists]]
description = "CDK build output once committed by mistake"
paths = ['''^cdk/cdk\.out/''', '''^cdk/node_modules/''']

# The staging votes site's public key (an Ed25519 public key, base64), the
# monitor's default for staging in .github/workflows/monitor.yml.
[[allowlists]]
description = "the staging votes site's public key"
regexes = ['''c4dqg2ssGVylbO9Xnpdv4zopmzx9S\+\+4KgxMWOyhXJQ=''']

# The staging site's KMS keys' public halves since its fresh start (GC
# #12656): the site key (Ed25519, base64) and the list anchor key's
# SubjectPublicKeyInfo (P-256, base64), pinned in monitor.yml and the
# runbook. Both are public.
[[allowlists]]
description = "the staging votes site's KMS public keys"
regexes = ['''m3x8G8MlAnzaOoHr0eg0M2j38mE4d15hkNekqdOAios=''', '''MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEEVhK17Y0fK2EG4KYQPzr2h5AVhO/BkVMQuQ9LTQVH6\+02DFyVqD3hJMwZHHxke9bHEdocFFhd7FqqMOAnqxMFA==''']

# A made-up KMS key id in votesctl's tests (cmd/votesctl/sign_test.go,
# votes PR #34): a fixture of sequential hex, not a key of any account.
# Every branch's history is scanned (fetch-depth 0, gitleaks git scans
# --all), so this is in both PRs that the scan sees it from.
[[allowlists]]
description = "a made-up KMS key id in votesctl's tests"
regexes = ['''0123abcd-4567-89ab-cdef-0123456789ab''']
